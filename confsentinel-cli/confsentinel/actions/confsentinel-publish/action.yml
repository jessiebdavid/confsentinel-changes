name: "ConfSentinel Publish Rules"
description: "Publishes architecture and security YAML guardrails to the Central Governance Engine"
inputs:
  rules-dir:
    description: "Directory containing YAML rule definitions"
    required: false
    default: "./rules"
  engine-url:
    description: "Central Governance Engine base URL"
    required: true
  governance-token:
    description: "Authentication token for rule publishing"
    required: true
  prune:
    description: "Deactivate omitted rules on central engine (true/false)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install ConfSentinel CLI
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install confsentinel-cli

    - name: Execute Policy Publication
      shell: bash
      env:
        CONFSENTINEL_ENGINE_URL: ${{ inputs.engine-url }}
        CONFSENTINEL_GOVERNANCE_TOKEN: ${{ inputs.governance-token }}
      run: |
        PRUNE_FLAG=""
        if [ "${{ inputs.prune }}" = "true" ]; then
          PRUNE_FLAG="--prune"
        fi
        confsentinel publish-rules --rules-dir "${{ inputs.rules-dir }}" $PRUNE_FLAG