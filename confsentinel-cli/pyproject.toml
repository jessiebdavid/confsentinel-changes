[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confsentinel-cli"
version = "1.0.0"
description = "ConfSentinel: Shift-Left Cloud-Native Configuration Governance & Policy Enforcement CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Platform Architecture & Security Team", email = "sec-arch@enterprise.org" }
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "ruamel.yaml>=0.18.0",
    "rich>=13.7.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0"
]

[project.scripts]
confsentinel = "confsentinel.cli:app"
confsentinel-cli = "confsentinel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["confsentinel"]

[tool.hatch.build.targets.wheel.package-data]
confsentinel = ["resources/*.json"]