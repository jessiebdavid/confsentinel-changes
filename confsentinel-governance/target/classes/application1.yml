server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: governance-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/confsentinel}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true

confsentinel:
  security:
    governance-token: ${CONFSENTINEL_GOVERNANCE_TOKEN:secret-governance-token-xyz}
    ci-token: ${CONFSENTINEL_CI_TOKEN:secret-ci-token-abc}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics