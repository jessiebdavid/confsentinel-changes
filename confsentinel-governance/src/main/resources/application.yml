spring:
  application:
    name: confsentinel-governance

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/confsentinel}
    username: ${SPRING_DATASOURCE_USERNAME:postgresadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:test@1234}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      # Use "validate" so Flyway handles DDL while Hibernate ensures entity alignment
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

server:
  port: ${SERVER_PORT:8080}
  
confsentinel:
  security:
    # If CONFSENTINEL_GOVERNANCE_TOKEN env var is set, Spring uses it.
    # Otherwise, it falls back to the default value after the colon.
    governance-token: ${CONFSENTINEL_GOVERNANCE_TOKEN:cs_gov_82cd066d2038732b17129784bda2e7d74dc88b2072a9f1c76a32f7cae2c47fc8}
    ci-token: ${CONFSENTINEL_CI_TOKEN:cs_ci_your_generated_token_here}